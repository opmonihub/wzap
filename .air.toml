root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -buildvcs=false -o ./tmp/wzap ./cmd/wzap"
bin = "./tmp/wzap"
full_bin = "./tmp/wzap serve"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "node_modules", ".git", "manager/.output", "manager/node_modules", ".opencode", "docs"]
exclude_regex = ["_test\\.go$"]
delay = 200
stop_on_error = true
kill_delay = "500ms"
log = "build-errors.log"
send_interrupt = true

[misc]
clean_on_exit = true
