# Development overlay: use with docker-compose.yml (and local overrides).
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build wzap manager-dev
services:
  wzap:
    image: wzap:dev-live-reload
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      WZAP_MANAGER_DEV_URL: http://manager-dev:3000
    volumes:
      - .:/src:cached
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    depends_on:
      manager-dev:
        condition: service_started
    healthcheck:
      test: ["CMD", "/src/tmp/wzap", "healthcheck"]
    stop_grace_period: 20s

  manager-dev:
    image: node:24-slim
    working_dir: /src/manager
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --port 3000 --host 0.0.0.0"]
    environment:
      NUXT_DEV_PROXY_TARGET: http://wzap:8080
      NUXT_DEV_HMR_CLIENT_PORT: "8081"
    volumes:
      - ./manager:/src/manager:cached
      - manager-node-modules:/src/manager/node_modules
      - manager-pnpm-store:/src/manager/.pnpm-store
      - manager-nuxt-cache:/src/manager/.nuxt
      - manager-output:/src/manager/.output

volumes:
  go-build-cache:
  go-mod-cache:
  manager-node-modules:
  manager-pnpm-store:
  manager-nuxt-cache:
  manager-output:
