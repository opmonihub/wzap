securityDefinitions:
  apikey:
    description: 'Machine credential in the literal apikey header: a global key grants
      administrative scope, an instance key grants access only to its own instance.
      Dual-auth API routes also accept the wzap_session cookie (user ownership/admin
      scope); cookie security cannot be modeled in Swagger 2.0. /auth/* uses cookies
      rather than this header.'
    in: header
    name: apikey
    type: apiKey
swagger: "2.0"
