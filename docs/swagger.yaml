info:
  contact: {}
  description: 'Standalone multi-instance WhatsApp gateway with authenticated REST
    commands and durable events. Normal REST JSON successes use {"data": ...}; standard
    errors use {"error": {"code", "message"}}. No-content responses, binary media,
    the raw Chatwoot webhook acknowledgement and Manager HTML/redirects have their
    own formats. Dual-auth API routes accept a valid wzap_session cookie or the apikey
    header. Global keys and admin sessions have administrative scope; user sessions
    are restricted to owned instances; instance keys reach only their own instance
    and cannot use collection/admin routes. Swagger 2.0 cannot declare cookie security:
    use an existing manager session cookie for session calls, or Authorize with an
    apikey for machine calls. The /auth/* endpoints use session cookies, never apikey
    authentication; login, logout, health probes, Swagger, Manager and the Chatwoot
    webhook load without an apikey.'
  title: wzap
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies the email/password credentials and mints the wzap_session
        cookie. Unknown email and wrong password share one 401 response.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authsession.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Identity, wrapped in the data envelope; the wzap_session cookie
            is set
          headers:
            Set-Cookie:
              description: Sets the httpOnly wzap_session cookie
              type: string
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/core.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authsession.MeEnvelope'
              type: object
        "400":
          description: Malformed body
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "401":
          description: Invalid credentials
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "413":
          description: Body exceeds the 1 MiB limit
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "429":
          description: Login rate limit exceeded
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "500":
          description: Internal error
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
      summary: Log in to the manager session
      tags:
      - auth
  /auth/logout:
    post:
      description: Clears the wzap_session cookie. There are no server-side sessions.
      produces:
      - application/json
      responses:
        "200":
          description: Status, wrapped in the data envelope
          headers:
            Set-Cookie:
              description: Clears the wzap_session cookie
              type: string
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/core.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authsession.LogoutResponse'
              type: object
      summary: Log out of the manager session
      tags:
      - auth
  /auth/me:
    get:
      description: Answers the identity of the wzap_session cookie holder, 401 without
        a valid session.
      produces:
      - application/json
      responses:
        "200":
          description: Identity, wrapped in the data envelope
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/core.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authsession.MeEnvelope'
              type: object
        "401":
          description: Missing or invalid session
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "500":
          description: Internal error
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
      summary: Show the current manager session
      tags:
      - auth
  /chatwoot/webhook/{id}:
    post:
      consumes:
      - application/json
      description: 'Public by design: no apikey or session cookie is required. The
        per-instance limiter can return 429. Success and discarded events return the
        raw {"content":""} acknowledgement, outside the REST data envelope. Operational
        commands are discarded here and must use the authenticated /instances/{id}/chatwoot/command
        route.'
      parameters:
      - description: Instance UUID or name (exact, case-sensitive)
        in: path
        name: id
        required: true
        type: string
      - description: Chatwoot event subset; unknown fields are ignored
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inbound.Payload'
      produces:
      - application/json
      responses:
        "200":
          description: Raw acknowledgement with empty content
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            properties:
              content:
                type: string
            type: object
        "400":
          description: Connector disabled or invalid body (including oversized body)
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "404":
          description: Invalid or missing instance
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "409":
          description: 'instance_name_taken: name already in use'
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "429":
          description: Per-instance webhook rate limit exceeded
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
        "500":
          description: Internal error
          headers:
            X-Request-Id:
              description: Correlation id, generated when absent
              type: string
          schema:
            $ref: '#/definitions/core.ErrorEnvelope'
      summary: Receive a Chatwoot webhook
      tags:
      - chatwoot
  /healthz:
    get:
      description: Reports liveness without authentication. The process is alive whenever
        it replies.
      produces:
