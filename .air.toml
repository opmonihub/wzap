root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -buildvcs=false -o ./tmp/wzap ./cmd/wzap"
bin = "./tmp/wzap"
full_bin = "exec bash ./docker/dev-go.sh run ./tmp/wzap serve"
include_ext = ["go", "mod", "sum", "sql"]
exclude_dir = ["tmp", "vendor", "node_modules", ".git", "manager/node_modules", "manager/.nuxt", "manager/.output", "manager/.data", ".opencode", ".worktrees", ".superpowers", ".codex", ".factory"]
exclude_regex = ["_test\\.go$"]
delay = 200
stop_on_error = true
kill_delay = "12s"
log = "build-errors.log"
send_interrupt = true

[misc]
clean_on_exit = true
