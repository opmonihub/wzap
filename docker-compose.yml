name: wzap

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wzap
      POSTGRES_USER: wzap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-wzap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wzap -d wzap"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/cccs/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wzap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wzap-secret-key}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Provisions the media bucket once MinIO is healthy. The application also
  # ensures the bucket at boot, so this is an accelerator for first-run
  # environments, not the only provisioning path.
  minio-init:
    image: docker.io/cccs/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${WZAP_S3_BUCKET} &&
      mc anonymous set none local/$${WZAP_S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wzap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wzap-secret-key}
      WZAP_S3_BUCKET: ${WZAP_S3_BUCKET:-wzap-media}

  wzap:
    image: wzap:dev
    build: .
    restart: unless-stopped
    environment:
      WZAP_API_KEY: ${WZAP_API_KEY:-dev-wzap-token}
      WZAP_JWT_SECRET: ${WZAP_JWT_SECRET:-dev-jwt-secret-0123456789abcdef01}
      WZAP_ADMIN_EMAIL: ${WZAP_ADMIN_EMAIL:-}
      WZAP_ADMIN_PASSWORD: ${WZAP_ADMIN_PASSWORD:-}
      WZAP_DATABASE_URL: postgres://wzap:${POSTGRES_PASSWORD:-secret}@postgres:5432/wzap?sslmode=disable
      WZAP_NATS_URL: nats://nats:4222
      WZAP_PUBLIC_URL: http://127.0.0.1:8081
      WZAP_AUTO_MIGRATE: "true"
      WZAP_DATA_DIR: /data
      WZAP_S3_ENDPOINT: http://minio:9000
      WZAP_S3_BUCKET: ${WZAP_S3_BUCKET:-wzap-media}
      WZAP_S3_REGION: us-east-1
      WZAP_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-wzap}
      WZAP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-wzap-secret-key}
      WZAP_S3_USE_TLS: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wzap", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  natsdata:
  media:
  miniodata:
